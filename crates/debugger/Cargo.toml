[package]
name = "rsx"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "rsx"
path = "src/main.rs"

[dependencies]
rsx-machine = { path = "../machine" }
eframe = { version = "0.31", default-features = false, features = ["wgpu", "default_fonts"] }
egui = "0.31"
serde = { version = "1", features = ["derive"] }
toml = "0.8"

[dev-dependencies]
tempfile = "3"
